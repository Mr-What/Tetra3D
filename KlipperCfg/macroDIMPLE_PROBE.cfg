[gcode_macro _DIMPLE_UPDATE_VERTEX]
gcode:
    _DIMPLE_SOLVE_3 A=1 B=2 C=3 V=1 X0={params.X0} Y0={params.Y0}
    _DIMPLE_SOLVE_3 A=1 B=2 C=4 V=2 X0={params.X0} Y0={params.Y0}
    _DIMPLE_SOLVE_3 A=1 B=3 C=4 V=3 X0={params.X0} Y0={params.Y0}
    _DIMPLE_SOLVE_3 A=2 B=3 C=4 V=4 X0={params.X0} Y0={params.Y0}
    _DIMPLE_ESTIMATE_VERTEX

