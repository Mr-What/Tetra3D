[gcode_macro _DIMPLE_ESTIMATE_VERTEX]
description: Combine four 3-point vertex candidates and report 4-point residuals.
gcode:
    {% set state = printer["gcode_macro _DIMPLE_STATE"] %}
    {% set m = 0.2679492 %}
    {% set va = state.vertex[1] %}
    {% set vb = state.vertex[2] %}
    {% set vc = state.vertex[3] %}
    {% set vd = state.vertex[4] %}

    # Candidate slots 1..4.  vertex[0] is the final combined estimate.
    {% set xs = [va[0], vb[0], vc[0], vd[0]]|sort %}
    {% set ys = [va[1], vb[1], vc[1], vd[1]]|sort %}
    {% set zs = [va[2], vb[2], vc[2], vd[2]]|sort %}

    {% set xv = (xs[1] + xs[2]) / 2.0 %}
    {% set yv = (ys[1] + ys[2]) / 2.0 %}
    {% set zv = (zs[1] + zs[2]) / 2.0 %}

    {% set p1 = state.probe[1] %}
    {% set p2 = state.probe[2] %}
    {% set p3 = state.probe[3] %}
    {% set p4 = state.probe[4] %}

    {% set r1 = ((p1[0]-xv)*(p1[0]-xv) + (p1[1]-yv)*(p1[1]-yv))**0.5 %}
    {% set r2 = ((p2[0]-xv)*(p2[0]-xv) + (p2[1]-yv)*(p2[1]-yv))**0.5 %}
    {% set r3 = ((p3[0]-xv)*(p3[0]-xv) + (p3[1]-yv)*(p3[1]-yv))**0.5 %}
    {% set r4 = ((p4[0]-xv)*(p4[0]-xv) + (p4[1]-yv)*(p4[1]-yv))**0.5 %}

    {% set e1 = p1[2] - (zv + m*r1) %}
    {% set e2 = p2[2] - (zv + m*r2) %}
    {% set e3 = p3[2] - (zv + m*r3) %}
    {% set e4 = p4[2] - (zv + m*r4) %}

    {% set es = [e1|abs,e2|abs,e3|abs,e4|abs]|sort %}
    {% set emin = es[0] %}
    {% set emax = es[3] %}
    {% set span = emax - emin %}

    TLOG PREFIX="DIMPLE" MSG="{'V median: X=%.5f Y=%.5f Z=%.5f; candidate span: X=%.5f Y=%.5f Z=%.5f' % (xv, yv, zv, xs[3]-xs[0], ys[3]-ys[0], zs[3]-zs[0])}"
    TLOG PREFIX="DIMPLE" MSG="{'residuals mm: x+=%.5f y+=%.5f x-=%.5f y-=%.5f; span=%.5f' % (e1, e2, e3, e4, span)}"

    ; check for outliers, and re-compute xv,yv,zv after rejecting outliers
    ; this is not very good, but analyse how often it happens and
    ; come up with something better
    {% if es[3] > 2*es[2] %}
        {% if e1|abs == emax %}
	    {% set vv = [vb,vc,vd] %}
	    {% set bad = 1 %}
	{% elif e2|abs == emax %}
	    {% set vv = [va,vc,vd] %}
	    {% set bad = 2 %}
	{% elif e3|abs == emax %}
            {% set vv = [va,vb,vd] %}
	    {% set bad = 3 %}
	{% else %}
	    {% set vv = [va,vb,vc] %}
	    {% set bad = 4 %}
	{% endif %}
        {% set xv = (vv[0][0] + vv[1][0] + vv[2][0]) / 3 %}
        {% set yv = (vv[0][1] + vv[1][1] + vv[2][1]) / 3 %}
        {% set zv = (vv[0][2] + vv[1][2] + vv[2][2]) / 3 %}
        TLOG PREFIX="DIMPLE" MSG="{'rejecting %d mean of remaining %.3f %.3f %.3f'
	    % (bad,xv,yv,zv)}"
    {% endif %}
    _DIMPLE_SET_VERTEX INDEX=0 X={xv} Y={yv} Z={zv}
    PROBER X={xv} Y={yv} tag='0 probe at estimated vertex' INDEX=0
    REL Z=5 F=4000
    
