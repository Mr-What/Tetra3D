[gcode_macro _DIMPLE_UPDATE_NEIGHBOR]
gcode:
    {% set dx = params.DX|float %}
    {% set dy = params.DY|float %}
    {% set idx = params.INDEX|int %}
    {% set s = printer["gcode_macro _DIMPLE_STATE"] %}
    {% set cx = s.vertex[0][0] %}
    {% set cy = s.vertex[0][1] %}
    PROBER X={cx+dx} Y={cy+dy} TAG="{'%d neighbor ' % idx}" INDEX={idx}

# shift by [X0,Y0] and solve relative to this instead of [0,0]
# to avoid a round off problem
[gcode_macro _DIMPLE_SOLVE_3]
description: solve for the location of the dimple vertex, given 3 probes
gcode:
    {% set idxA = params.A|default(1)|int %}
    {% set idxB = params.B|default(2)|int %}
    {% set idxC = params.C|default(3)|int %}
    {% set idxV = params.V|default(0)|int %}
    {% set x0 = params.X0|float %}
    {% set y0 = params.Y0|float %}
    {% set m = 0.2679492 %}
    {% set s = printer["gcode_macro _DIMPLE_STATE"] %}

    {% set p1 = s.probe[idxA] %}
    {% set p2 = s.probe[idxB] %}
    {% set p3 = s.probe[idxC] %}

    {% set x1 = p1[0]-x0 %}{% set y1 = p1[1]-y0 %}{% set z1 = p1[2] %}
    {% set x2 = p2[0]-x0 %}{% set y2 = p2[1]-y0 %}{% set z2 = p2[2] %}
    {% set x3 = p3[0]-x0 %}{% set y3 = p3[1]-y0 %}{% set z3 = p3[2] %}

    {% set a1 = z1 / m %}
    {% set a2 = z2 / m %}
    {% set a3 = z3 / m %}

    {% set A2 = x2 - x1 %}
    {% set B2 = y2 - y1 %}
    {% set A3 = x3 - x1 %}
    {% set B3 = y3 - y1 %}

    {% set C2 = ((x2*x2 + y2*y2) - (x1*x1 + y1*y1)
               - (a2*a2 - a1*a1)) / 2.0 %}
    {% set C3 = ((x3*x3 + y3*y3) - (x1*x1 + y1*y1)
               - (a3*a3 - a1*a1)) / 2.0 %}

    {% set D2 = a2 - a1 %}
    {% set D3 = a3 - a1 %}

    {% set det = A2*B3 - A3*B2 %}

    {% set xv = x0 %}  ; set err/default
    {% set yv = y0 %}
    {% set zv = 0  %}
    {% set q = none %}

    {% if det|abs < 0.000001 %}
        TLOG PREFIX="DIMPLE" MSG="_DIMPLE_SOLVE_3: probe points are collinear"
    {% else %}
        {% set xa = (C2*B3 - C3*B2) / det %}
        {% set xb = (-D2*B3 + D3*B2) / det %}
        {% set ya = (A2*C3 - A3*C2) / det %}
        {% set yb = (-A2*D3 + A3*D2) / det %}

        {% set ux = xa - x1 %}
        {% set uy = ya - y1 %}
        {% set qa = xb*xb + yb*yb - 1.0 %}
        {% set qb = 2.0*(xb*ux + yb*uy - a1) %}
        {% set qc = ux*ux + uy*uy - a1*a1 %}
        {% set disc = qb*qb - 4.0*qa*qc %}

        {% if disc < 0.0 %}
            TLOG PREFIX="DIMPLE" MSG="_DIMPLE_SOLVE_3: no real cone solution"
        {% else %}
            {% set root_disc = disc**0.5 %}
            {% if qa|abs < 0.000001 %}
                {% if qb|abs < 0.000001 %}
                    TLOG PREFIX="DIMPLE" MSG="_DIMPLE_SOLVE_3: unstable solution"
	        {% else %}
                    {% set q = -qc/qb %} ; nearly linear
                {% endif %}
	    {% else %}
                {% set q1 = (-qb + root_disc) / (2.0*qa) %}
                {% set q2 = (-qb - root_disc) / (2.0*qa) %}

                # Pick the candidate whose three implied radii are all non-negative.
                {% if a1 + q1 >= 0 and a2 + q1 >= 0 and a3 + q1 >= 0 %}
                    {% set q = q1 %}
                {% elif a1 + q2 >= 0 and a2 + q2 >= 0 and a3 + q2 >= 0 %}
                    {% set q = q2 %}
                {% else %}
                    TLOG PREFIX="DIMPLE" MSG="_DIMPLE_SOLVE_3: no physically valid cone root"
                {% endif %}
            {% endif %}
	{% endif %}
        {% if q is not none %}
            {% set xv = xa + xb*q + x0 %}
            {% set yv = ya + yb*q + y0 %}
            {% set zv = -m*q %}
        {% endif %}
    {% endif %}
    _DIMPLE_SET_VERTEX INDEX={idxV} X={xv} Y={yv} Z={zv}
	
[gcode_macro _DIMPLE_SET_VERTEX]
gcode:
    {% set idx = params.INDEX|int %}
    {% set x   = params.X|float %}
    {% set y   = params.Y|float %}
    {% set z   = params.Z|float %}
    {% set s = printer["gcode_macro _DIMPLE_STATE"] %}
    {% set cache = s.vertex %}
    {% set val = [x, y, z] %}
    {% if idx < 0 or idx >= cache|length %}
       {action_raise_error("_DIMPLE_SET_VERTEX: INDEX %d out of range 0..%d"
                        % (idx, cache|length - 1))}
    {% endif %}
    {% set update = cache[:idx] + [val] + cache[idx + 1:] %}
    SET_GCODE_VARIABLE MACRO=_DIMPLE_STATE VARIABLE=vertex VALUE="{update}"
    TLOG PREFIX="DIMPLE" MSG="{'%d computed vertex: %.3f, %.3f, %.3f' % (idx, x, y, z)}"
