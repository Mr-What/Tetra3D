# macros to run at the start (and end) of a print

[gcode_macro PRINT_DONE]
description: call this when a print is done
gcode:
    G91 ; switch to relative motion
    M83 ; relative position extrusion mode
    G1 Z5 E-3 F8000
    G90 ; back to absolute position
    HEATERS_OFF
    M107    ; part cooling fan off
    G4 P500 ; a little time for extruder to stop flowing
    HOMEPOS
    MOTORS_OFF

[gcode_macro HEATERS_OFF]
gcode:
  M104 S0 ; extruder heater off, no-wait
  M140 S0

[gcode_macro SET_EXTRUDER]
gcode:
    {% set T = params.T|default(0)|float %}
    #M104 S{T}  # non-blocking
    #M109 S{T} # blocking
    SET_HEATER_TEMPERATURE TARGET={T} HEATER=extruder

[gcode_macro SET_BED]
gcode:
    {% set T = params.T|default(0)|float %}
    M140 S{T}  # non-blocking
    #M190 S{T} # blocking
    #SET_HEATER_TEMPERATURE TARGET={T} HEATER=bed?

; For max_extrude_cross_section 1.0, max E is roughly 4mm / 10mm of movement.
; To get a .6mm wide line at height 0.25mm needs 6.24 extrusion per 100mm line
[gcode_macro PRINT_START]
description: start procedure.  Wipe nozzle toward all 3 towers
gcode:
    {% set      BED_TEMP = params.BED_TEMP     |default( 60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(230)|float %}
    {% set R = params.R|default(66)|float %}

    {% set c30 = 0.866 %}
    {% set s30 = 0.5 %}

    {% set e = R * 0.067 %}

    G90 ; absolute positions
    G21 ; mm
    G92 E0 ; set current extruder position to 0
    M83 ; relative position extrusion mode
    G92 E0 ; set current extruder position to 0
    M84 ; motor off
    M105 ; part fan off
    M118 Make sure effector is over center of bed!!!
    M118 Heating...
    M109 S{EXTRUDER_TEMP} ; set extruder temp, and wait
    HOME
    G1 E6 F300
    G4 P3000 ; pause to allow user to wipe nozzle if desired
    ; -- Delta startup pattern, 60mm radius
    {% set y = c30 * R %}
    {% set x = s30 * R %}
    G0 X{x} Y{ -y} Z5 F6000
    G4 P300
    G1 Z0.1 F600 E6
    G0 Z0.25
    G3 X{R} Y0 I{ -x} J{y} F1200  E{e}
    G2 X{ x-1 } Y{ 1-y} I{ -R } J0 E{e}
    G1 Z5 E-5
    G4 P300
    
    G0 X{ -x } Y{ -y } Z5 F6000
    G4 P300
    G1 Z0.1 F600 E6
    G0 Z0.25
    G2 X{ -R } Y0 I{x} J{y} F1200 E{e}
    G3 X{ 1-x } Y{ 1-y } I{R} J0 E{e}
    G1 Z5 E-3

    {% set y = c30 * R %}
    {% set x = s30 * R %}
    G0 X{x} Y{y} Z5 F6000
    G4 P300
    G1 Z0.25 F600 E3
    G4 P300
    G3 X{ -x } Y{y}  I{ -x } J{ -y } F1200 E{e}
    G2 X{x} Y{ y-1 } I{x} J{ -y } E0  ; just wipe, last move
    G1 Z5 E-3
    G4 P300
    G0 X0 Y0 Z10 F6000 E3
    
