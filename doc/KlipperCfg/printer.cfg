# $Id: printer.cfg,v 1.7 2026/05/14 21:07:36 aaron Exp aaron $
# This file contains prototype tetra pin mappings for the
#
#               BIGTREETECH SKR mini E3 v2.0
#
# To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader" and USB communication. Also,
# select "Enable extra low-level configuration options" and configure
# "GPIO pins to set at micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# This setup is for the experimental tetrahedral 3D printer,
# which uses the tilted_delta kinematic model, available at:
#
#    https://github.com/Mr-What/klipper/tree/tilted-delta-kinematics-dev
#
# The master of this project is intended to track the master at
# https://github.com/Klipper3d/klipper
# The deviation from the official klipper master is tracked in the
# tilted-delta-kinematics-dev  branch of https://github.com/Mr-What/klipper
#
# calibration tools and drawings are in the Tetra3D project:
# https://github.com/Mr-What/Tetra3D

[printer]
kinematics: tilted_delta
# 260917081443 delta_angles: 210, 330 , 90
# 260917171418 delta_angles: 209.467574 , 329.973249 , 86.351720
delta_angles: 209.549532 , 329.953925 , 86.341232
# 260916130044 delta_radius: 170, 170, 170
# 260916162929 delta_radius: 169.269611 , 169.269611 , 169.269611
# 260917081443 delta_radius: 169.234405 , 169.873623 , 168.545035
# 260917171418 delta_radius: 167.001702 , 167.606229 , 167.444767
delta_radius: 167.099193 , 167.649278 , 167.532209
# 260916162929 arm_lengths:  286, 286, 286
# 260917081443 arm_lengths: 285.962522 , 285.951980 , 285.920650
# 260917171418 arm_lengths: 285.297184 , 286.922979 , 286.676289
arm_lengths: 285.465101 , 287.105724 , 286.849931
# 260917081443 tilt_radial:    13, 13, 13
# 260917171418 tilt_radial: 13.136963 , 12.201642 , 12.502378
tilt_radial: 13.157258 , 12.150354 , 12.529188
# 260917081443 tilt_tangential: 0,  0,  0
# 260917171418 tilt_tangential: 0.444377 , 0.297908 , -0.431905
tilt_tangential: 0.419622 , 0.289138 , -0.420075
max_velocity: 300  # mm/s
max_accel: 800
max_z_velocity: 300
max_z_accel: 800
print_radius: 80
minimum_z_position: -10   # not used in kinematics, but needs to be negative for bed probes, which can be negative Z


[stepper_a]
# 260916130044 position_endstop: 480
# 260916162929 position_endstop: 479.5711
# 260917081443 position_endstop: 479.5509
# 260917171418 position_endstop: 479.1852
# one endstop came off.  re-cal. position_endstop: 479.0999
position_endstop: 479.45
position_min: 113
#position_max: 485   # slightly above position_endstop?
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
# try to have endstops NC, so that they fail triggered, no motion
# if they are wired NO, when a wire comes off, they could crash
endstop_pin: PC0
homing_speed: 20   # mm/s
second_homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5

[stepper_b]
# 260916130044 position_endstop: 477
# 260916162929 position_endstop: 476.8802
# 260917081443 position_endstop: 476.7103
# 260917171418 position_endstop: 476.8013
# 260918 position_endstop: 476.6487
position_endstop: 475.4355
#position_max: 480    # slightly above position_endstop
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: PC1
position_min: 112
homing_speed: 20   # mm/s
second_homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5

[stepper_c]
# 260916130044 position_endstop: 478
# 260916162929 position_endstop: 474.5902
# 260917081443 position_endstop: 474.6504
# 260917171418 position_endstop: 474.8809
# 260918  position_endstop: 474.7961
position_endstop: 474.9276
#position_max: 482
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: PC2
position_min: 114
homing_speed: 20   # mm/s
second_homing_speed: 5
homing_retract_dist: 5
homing_retract_speed: 5

[tmc2209 stepper_a]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.5 # 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_b]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.4  # 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_c]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.4 # 0.580
stealthchop_threshold: 999999

###  Select current probe type
#[include probeMMH0.cfg]  # Mellow MultiHead Zero
[include probeD2HW.cfg]  # Omron? D2HW-A201D small micro plunger endstop switch
#[include probeBiCQ.cfg]  # BTT? BiQu MicroProbe (retractable)
#[include probeEndstop.cfg]  # endstop microswith as probe
#[include probeKin.cfg]  # Continuity on kinematic mount points as probe


#[delta_calibrate]
#radius: 80

# put this back when we hook up bowden extruder
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 6.633  # gearhead rotation << motor rotation
nozzle_diameter: 0.4 # 0.2
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 400
min_extrude_temp: 160
#max_extrude_temp: 275
max_extrude_only_distance: 200
max_extrude_only_velocity: 40
max_extrude_only_accel: 1000
max_extrude_cross_section: 2 # 1.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6 # typical is 0.6 to 0.9
stealthchop_threshold: 30
sense_resistor: 0.11  # guess at .11 Ohm sense for 2209 on most BTT boards
hold_current: 0.5
interpolate: True


# uncomment if/when we get a heated bed
#[heater_bed]
#heater_pin: PC9
#sensor_type: ATC Semitec 104GT-2
#sensor_pin: PC3
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
#min_temp: -200
#max_temp: 3130

[gcode_arcs]
resolution: 0.5 # mm

[heater_fan extruder_fan] # hot end fan
pin: PC6
heater: extruder
heater_temp: 42
kick_start_time: 1

[fan] # part fan
pin: PC7
kick_start_time: 0.5


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_30FFDA054754343040811557-if00
# serial: /dev/ttyACM0

[force_move]
enable_force_move: True

[static_digital_output usb_pullup_enable]
pins: !PA14

[verify_heater extruder]
max_error: 999999
check_gain_time: 999999
hysteresis: 999999

#[verify_heater heater_bed]
#max_error: 999999
#check_gain_time: 999999
#hysteresis: 999999


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

[include mainsail.cfg]
[include tetraMacros.cfg]

