[gcode_macro MOTORS_OFF]
gcode:
    M84

[gcode_macro REL]
description: Change to relative mode, do requested move, then back to absolute if we were in absolute
gcode:
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(5)|float %}
    {% set f = params.F|default(600)|float %}
    
    {% set was_relative = printer.gcode_move.relative_coordinates %}
    G91
    G1 X{x} Y{y} Z{z} F{f}
    {% if not was_relative %}
    G90
    {% endif %}

[gcode_macro HOMEPOS]
description: Go to default rest position (0,0,150)
gcode:
    G0 X0 Y0 Z150 F5000

[gcode_macro HOME]
description: Home (G28) then go to (0,0,150)
gcode:
    G28
    GET_POSITION
    ;G1 X0 Y0 Z150 F800
    HOMEPOS
    GET_POSITION  ; for some reason, kinematic is behind here.  AI is halucinating wrong answers when I ask it to explain
    G4 P1500  ; pause, ms
    GET_POSITION

