[gcode_macro MOTORS_OFF]
gcode:
    M84

[gcode_macro REL]
description: Change to relative mode, do requested move, then back to absolute if we were in absolute
gcode:
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(5)|float %}
    {% set f = params.F|default(600)|float %}
    
    {% set was_relative = printer.gcode_move.relative_coordinates %}
    G91
    G1 X{x} Y{y} Z{z} F{f}
    {% if not was_relative %}
    G90
    {% endif %}

[gcode_macro HOMEPOS]
description: Go to default rest position (0,0,150)
gcode:
    G0 X0 Y0 Z150 F5000

[gcode_macro HOME]
description: Home (G28) then go to (0,0,150)
gcode:
    G28  ; home twice, in case effector started far from center
    REL Z=-3 F=3000
    G28
    GET_POSITION
    ;G1 X0 Y0 Z150 F800
    HOMEPOS
    GET_POSITION  ; for some reason, kinematic is behind here.  AI is halucinating wrong answers when I ask it to explain
    G4 P1500  ; pause, ms
    GET_POSITION

[gcode_macro TLOG]
description: Generic timestamped logger, with prefix - Usage -- TLOG PREFIX="Done" MSG="{'Start location [%.3f, %.3f]' % (p.x, p.y)}"
gcode:
    {% set prefix = params.PREFIX|default("LOG") %}
    {% set msg = params.MSG|default("Seconds since boot") %}
    {% set t = printer.toolhead.estimated_print_time|float %}
    {action_respond_info("%s %.3f: %s" % (prefix, t, msg))}


[gcode_macro LOG_POSITION]
description: Show current toolhead position, with optional LABEL
gcode:
    {% set prefix = params.PREFIX|default("") %}
    {% set p = printer.toolhead.position %}
    TLOG PREFIX={prefix} MSG="{' POS=[%.3f, %.3f, %.3f]' % (p.x,p.y,p.z)}"

[gcode_macro SHOW_OFFSET]
description: Show the probe offset setting
gcode:
    {% set xo = printer.configfile.settings.probe.x_offset %}
    {% set yo = printer.configfile.settings.probe.y_offset %}
    {% set zo = printer.configfile.settings.probe.z_offset %}
    TLOG PREFIX="tetra" MSG="{'Probe offset [%g, %g, %.3f]' % (xo,yo,zo)}"
    
### small macros for tetra group buttone
[gcode_macro WEEDOWN]
gcode:
    REL Z=-0.02 F=300
    QUERY_PROBE

[gcode_macro WEEUP]
gcode:
    REL Z=0.02 F=300
    QUERY_PROBE

[gcode_macro SHOW_POS]
gcode:
    GET_POSITION

[gcode_macro SHOW_PROBE]
gcode:
    QUERY_PROBE

[gcode_macro SHOW_ENDSTOPS]
gcode:
    QUERY_ENDSTOPS

[gcode_macro RELOAD]
gcode:
    FIRMWARE_RESTART

[bed_mesh]
speed: 60
horizontal_move_z: 5
mesh_min: -60, -60       # probe coordinates near front‑left
mesh_max:  60,  60       # probe coordinates near back‑right
probe_count: 7, 7        # grid resolution (X,Y)
mesh_pps: 3, 3           # interpolation density
algorithm: bicubic       # or lagrange
bicubic_tension: 0.1
fade_start: 1
fade_end: 10

[gcode_macro USER_VARS]
variable_probez_z: 5.0    # default height before probe
variable_probez_f: 1500.0  # default move rate, mm/min, between probes
gcode:

[gcode_macro PROBEZ]
description: move to [X,Y], PROBE, then move up Z, default from USER_VARS
gcode:
    {% set uv = printer["gcode_macro USER_VARS"] %}
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    {% set z = params.Z|default(uv.probez_z)|float %}
    {% set f = params.F|default(uv.probez_f)|float %}
    #QUERY_PROBE
    G1 X{x} Y{y} F{f}
    #QUERY_PROBE
    PROBE
    #QUERY_PROBE
    #G4 P300
    #GET_POSITION
    REL Z={z} F={f}
    G4 P300
    #QUERY_PROBE

[gcode_macro BED_MESH_PROBE]
description: Perform the bed mesh probe, save it to a file named from SAVE=, and use it
gcode:
    {% set save = params.SAVE|default("default") %}
    BED_MESH_CALIBRATE PROFILE={save}
    SAVE_CONFIG
    BED_MESH_PROFILE LOAD={save}

[gcode_macro FANSTATUS]
description: Show current fan speeds
gcode:
  {% if printer.fan is defined %}
    {% set p = printer.fan %}
    {action_respond_info("part_fan speed=" ~ p.speed|string)}
  {% endif %}
  {% if printer.heater_fan is defined and printer.heater_fan.extruder_fan is defined %}
    {% set h = printer.heater_fan.extruder_fan %}
    {action_respond_info("extruder_fan speed=" ~ h.speed|string)}
  {% endif %}
  {% set h1 = printer["heater_fan extruder_fan"].speed %}
  {action_respond_info("heater_fan extruder_fan speed=" ~ h1.speed|string)}
  INSPECT_OBJECT O=fan
  INSPECT_OBJECT O=extruder


[gcode_macro INSPECT_OBJECT]
description: Usage: INSPECT_OBJECT O=<name>
gcode:
  {% set obj_name = params.O|default("") %}
  {% if not obj_name %}
    {action_respond_info("Usage: INSPECT_OBJECT O=<name>")}
  {% else %}
    {% if obj_name in printer %}
      {% set status = printer[obj_name] %}
      {action_respond_info(obj_name ~ " => " ~ status|string)}
    {% else %}
      {action_respond_info("No such object: " ~ obj_name)}
    {% endif %}
  {% endif %}

[gcode_macro HEX_OUTLINE]
description: Draw a hex outline, good for placing calibration plates
  R -- radius
  T -- 230 temp of extruder
gcode:
    {% set r  = params.R|default(87)|float %}
    {% set t  = params.T|default(230)|float %}
    {% set c60 = 0.5 %}
    {% set s60 = 0.866 %}
    G90 ; absolute positions
    G21 ; mm
    G92 E0 ; set current extruder position to 0
    M83 ; relative position extrusion mode
    G92 E0 ; set current extruder position to 0
    M84 ; motor off
    M105 ; part fan off
    M118 Make sure effector is over center of bed!!!
    M118 Heating...
    M109 S{t} ; set extruder temp, and wait
    HOME
    G0 E8 F1000
    G4 P5000  ; give some time for user to wipe noze if desired
    G0 X{r + 4} Y0 Z20 F3000
    G0 Z.1
    G4 P100
    ; for a .6 wide line, .3 high, that is .18mm^3 filament/mm
    ; 1.75mm diameter filament is 2.4 mm^3 / mm length
    ; so, extrude .18/2.4= 0.075 mm filament per mm travel
    {% set e = r * 0.075 %}
    {% set dx = c60 * r %}
    {% set dy = s60 * r %}
    G1 X{r} Y0 E2 Z.3
    G1 X{dx} Y{dy}  E{e} F1000
    G1 X{-dx} E{e}
    G1 X{-r} Y0 E{e}
    G1 X{-dx} Y{-dy} E{e}
    G1 X{dx}   E{e}
    G1 X{r} Y0 E{e}
    ; do it again, a little larger
    {% set r1 = r + 0.3 %}
    {% set dx = c60 * r1 %}
    {% set dy = s60 * r1 %}
    G0 X{r1} 
    G1 X{dx} Y{dy}  E{e} F1000
    G1 X{-dx} E{e}
    G1 X{-r1} Y0 E{e}
    G1 X{-dx} Y{-dy} E{e}
    G1 X{dx}   E{e}
    G1 X{r} Y0 E{e}
    G1 Z5 E-2 F3000
    G4 P1000
    PRINT_DONE
