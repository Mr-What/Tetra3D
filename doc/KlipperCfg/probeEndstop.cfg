##################################################################
## config for BTT MicroProbe V2, with retractable steel plunger
[output_pin probe_enable]
pin: PA1        # control pin — SKR Mini E3 V2.0 BLTouch header
value: 0        # 0 = retracted by default

[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[probe]
pin: ^!PC14                    # sensor pin, V2 = active low
deactivate_on_each_sample: False   # <-- the critical line for this probe
x_offset: 0                  # measure your actual mount offset
y_offset: 0
z_offset: 0                    # PROBE_CALIBRATE will set this properly
speed: 5.0
samples: 4
samples_tolerance: 0.05
samples_tolerance_retries: 7
samples_result: median # median, average, min or max
activate_gcode:
    PROBE_DOWN
    G4 P500                    # give the arm time to deploy
deactivate_gcode:
    PROBE_UP

[tmc2209 stepper_a]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.5 # 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_b]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.4  # 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_c]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.4 # 0.580
stealthchop_threshold: 999999

#[delta_calibrate]
#radius: 80

# put this back when we hook up bowden extruder
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 6.633  # gearhead rotation << motor rotation
nozzle_diameter: 0.4 # 0.2
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 500
min_extrude_temp: 160
#max_extrude_temp: 275
max_extrude_only_distance: 200
max_extrude_only_velocity: 40
max_extrude_only_accel: 1000
max_extrude_cross_section: 2 # 1.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6 # typical is 0.6 to 0.9
stealthchop_threshold: 30
sense_resistor: 0.11  # guess at .11 Ohm sense for 2209 on most BTT boards
hold_current: 0.5
interpolate: True


# uncomment if/when we get a heated bed
#[heater_bed]
#heater_pin: PC9
#sensor_type: ATC Semitec 104GT-2
#sensor_pin: PC3
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
#min_temp: -200
#max_temp: 3130

[gcode_arcs]
resolution: 0.5 # mm

[heater_fan extruder_fan] # hot end fan
pin: PC6
heater: extruder
heater_temp: 40
kick_start_time: 1

[fan] # part fan
pin: PC7
kick_start_time: 0.5


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_30FFDA054754343040811557-if00
# serial: /dev/ttyACM0

[force_move]
enable_force_move: True

[static_digital_output usb_pullup_enable]
pins: !PA14

[verify_heater extruder]
max_error: 999999
check_gain_time: 999999
hysteresis: 999999

#[verify_heater heater_bed]
#max_error: 999999
#check_gain_time: 999999
#hysteresis: 999999


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

[include mainsail.cfg]
[include tetraMacros.cfg]

